# 相机标定配置文件（海康 HikRobot 相机专用）
# 用法（在 Ubuntu 小电脑上）：
#   1) 采集:   ./build/capture configs/calibration.yaml -o assets/img_with_q
#   2) 内参:   ./build/calibrate_camera -c configs/calibration.yaml assets/img_with_q
#   3) 手眼:   ./build/calibrate_handeye -c configs/calibration.yaml assets/img_with_q
# 内参标定结果需要先回填到下面的 camera_matrix / distort_coeffs，手眼标定才能进行。

#####-----标定板参数-----#####
pattern_cols: 9                  # 棋盘格内角点列数（宽方向10格）
pattern_rows: 7                  # 棋盘格内角点行数（高方向8格）
capture_pose_stable_window_ms: 300
capture_pose_stable_range_deg: 0.30
capture_max_frame_age_ms: 100
square_size_mm: 20               # 棋盘格方格边长（毫米），若你的板子不同请修改

#####-----云台/IMU安装矩阵（手眼标定用）-----#####
# R_gimbal2imubody: [1, 0, 0, 0, 1, 0, 0, 0, 1]
R_gimbal2imubody: [-1, 0, 0, 0, 1, 0, 0, 0, -1]

#####-----相机内参（内参标定后回填）-----#####
# [fx, 0, cx, 0, fy, cy, 0, 0, 1]（3×3 行优先）
# 2026-10-09, 23 images; mean reprojection error: 0.5066px; RMS: 0.5962px
# 2048x1200 centered ROI, OffsetX=512, OffsetY=424; full sensor: 3072x2048
# Crop translation only: cx -= 512, cy -= 424; fx/fy and distortion unchanged.
camera_matrix: [2613.6238346662558, 0, 831.13793261490321, 0, 2623.9361517252046, 601.15236567678858, 0, 0, 1]
# [k1, k2, p1, p2, k3]
# 2026-10-20 重标（光圈/焦距动过，23 张，1600x1080 瞄准窗口，rms 0.2829 px）
distort_coeffs: [-0.14672657883564594, 0.63738545399917312, -0.00079995678728670956, -0.0020413307914658638, 0]

#####-----相机/云台外参（手眼标定后回填）-----#####
# 2026-10-10：旧注释作废（那份 R 含 180° 伪影，与正确值差 13.5°，别再用于任何验证）
# 2026-10-10 回填：R 取 011048 / wide / wide4 三轮独立采集的平均（跨批次一致性 ±0.9°）；t 用机械实测值（IMU 在相机后方 20cm、右侧 5cm、低 2cm）
R_camera2gimbal: [0.021136135, -0.009577720, 0.999730729, -0.999776201, -0.001103297, 0.021126526, 0.000900656, -0.999953524, -0.009598896]
t_camera2gimbal: [0.20, 0.05, 0.02]

#####-----相机配置（海康）-----#####
camera_name: "hikrobot"
# 2026-10-20：与实弹采集保持一致（现场光圈调过，亮度需同一口径复核）
exposure_ms: 6.0
gain: 16.0
# 内参在「瞄准实际使用的窗口」上标定：
#  · 该窗口已验证可出图（3072x2048 全画幅 StartGrabbing 0x80000006 起不来）；
#  · 畸变在用到的区域上拟合，不靠外推；
#  · 输出即瞄准坐标，回填 standard.yaml 时不需要平移 cx/cy。
camera_width: 1600
camera_height: 1080
camera_offset_x: 736
camera_offset_y: 480
camera_fps: 60.0
white_balance_auto: "off"
hikrobot_pixel_format: "BayerRG8"
trigger_enable: false             # 标定使用连续取流；保存前保持云台静止
trigger_source: 2
trigger_activation: 0
vid_pid: "2bdf:0001"             # 用 lsusb 确认你相机的 VID:PID，不同型号 PID 可能不同
require_cboard: false             # 本车姿态从 XUC 串口读取，不再等待旧 C 板 CAN

#####-----CAN协议配置（capture 需要读 C板四元数，手眼标定必需）-----#####
new_can_quat_id: 0x150           # 四元数姿态帧ID
new_can_cmd_id: 0x170            # 自瞄指令帧ID
can_interface: "can0"
debug_rx: false
debug_tx: true

#####-----XUC V2双向串口（TWLInfantry UART4 @460800）-----#####
xuc_enable: true                 # capture 只接收姿态，不调用 send()
xuc_serial_port: "/dev/serial/by-id/usb-1a86_USB_Serial-if00-port0"
xuc_serial_baud: 460800          # 与下位机 UART4 一致
xuc_yaw_sign: 1                  # 命令 yaw 符号；约定：帧内 yaw 增大 = 云台向左转
xuc_pitch_sign: -1               # 命令 pitch 符号；约定：帧内 pitch 增大 = 向下俯
xuc_imu_angle_unit: deg         # 回传 IMU 角度单位（驱动转为弧度）
xuc_command_angle_unit: deg     # 下发命令单位；电控 73ea451 固件期望度
xuc_imu_yaw_sign: -1             # 沿用 Phase 2B 已验证的世界系方向
xuc_imu_pitch_sign: 1            # 下位机IMU pitch方向，接板后确认
xuc_imu_yaw_offset_rad: 0.0
xuc_imu_pitch_offset_rad: 0.0
xuc_require_feedback_for_control: true
xuc_allow_control: false         # 接板确认前禁止驱动云台
xuc_allow_shoot: false           # 首次接板固定禁射
