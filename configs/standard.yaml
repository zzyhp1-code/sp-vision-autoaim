# 6500 rpm 四装甲“小陀螺”实弹复测配置；允许 shoot=1，仅在现场安全确认后使用。
# 2026-09-06 单因素修正：高速预测延迟增加 50 ms，使当前反转目标提前约 4°相位触发。
# 2026-09-12 抬高靶复算：靶高已由视觉闭环吸收，撤销额外 0.60° 固定上抬。
# 19.36 m/s 由 3200 rpm 实弹等效 9.53 m/s 按转速线性外推，须用实弹/测速仪复核。
# 2.7 m 预计垂直补偿约向上 7.75°；水平暂按上一轮弹着群向右修正 2.121°。
# 步兵自瞄运行配置（海康 HikRobot 相机）
# 用法：./build/standard configs/standard_hikrobot.yaml
# 基于 complete_template.yaml，相机换为海康 hikrobot，内外参已回填，附 XUC 串口键。

#####-----基础配置-----#####
# 敌方颜色：红色或蓝色
enemy_color: "blue"

#####-----神经网络参数-----#####
# 推理后端：tensorrt | openvino
inference_backend: openvino

# 装甲板识别后端：yolov8 | yolo11 | yolov5 | yolo26
yolo_name: yolo26

# 数字/字迹分类器模型路径
classify_model: assets/tiny_resnet.onnx

#####-----OpenVINO 模型路径-----#####
# YOLO模型路径（根据yolo_name选择对应模型）
yolo11_model_path: assets/yolo11.xml      # 输入640×640
yolov8_model_path: assets/yolov8.xml        # 输入416×416
yolov5_model_path: assets/yolov5.xml        # 输入640×640
yolo26_model_path: assets/yolo26.xml

# OpenVINO推理设备：CPU | GPU | AUTO
device: CPU

#####-----TensorRT模型路径-----#####
yolo11_engine_path: assets/engines/yolo11.engine
yolov8_engine_path: assets/engines/yolov8.engine

yolo11_onnx_path: assets/yolo11.onnx
yolov8_onnx_path: assets/yolov8.onnx

tensorrt_fp16_mode: true
tensorrt_int8_mode: false

#####-----推理参数-----#####
use_async_inference: false

min_confidence: 0.10

min_keypoint_confidence: 0.0
letterbox_value: 114
yolo26_swap_rb: false
yolo26_refine_color: false
# 仅当颜色、关键点和四边形几何信息彼此一致时，才接受低置信度候选目标。
# 红蓝两种颜色使用对称的判定条件。
yolo26_candidate_confidence: 0.04
yolo26_color_confirmed_min_confidence: 0.04
yolo26_memory_confirmed_min_confidence: 0.06
yolo26_color_confirmed_min_keypoint_confidence: 0.75
# 归一化得分：100*(R-B)/(R+B)，不受绝对曝光量影响。
yolo26_color_min_delta: 8.0
yolo26_color_single_bar_min_delta: 12.0
yolo26_color_min_brightness: 30
yolo26_color_min_pixels_per_bar: 6
yolo26_color_hold_frames: 20
detector_debug: false

use_traditional: true
# YOLO26 之前会忽略 use_traditional。自适应双灯条细化器现在将其作为默认启用开关；
# 如果找不到几何上相符的图像候选，就安全地保留网络输出的角点。
yolo26_refine_corners: true
corner_refine_roi_length_scale: 1.8
corner_refine_roi_width_scale: 0.9
corner_refine_max_center_error_ratio: 0.65
corner_refine_max_angle_error_deg: 25.0
corner_refine_max_pair_angle_error_deg: 8.0
corner_refine_min_pair_length_ratio: 0.65

#####-----功能开关-----#####
enable_buff: false
force_auto_aim: true

#####-----ROI（感兴趣区域）参数-----#####
roi:
  x: 420
  y: 50
  width: 600
  height: 600

use_roi: false

#####-----传统检测方法参数-----#####
threshold: 100
max_angle_error: 45
min_lightbar_ratio: 1.5
max_lightbar_ratio: 20
min_lightbar_length: 8
min_armor_ratio: 1
max_armor_ratio: 5
max_side_ratio: 1.5
max_rectangular_error: 25

#####-----跟踪器参数-----#####
min_detect_count: 5
tracker_association_max_cost: 0.8
tracker_batch_max_observations: 4
# 在车体模式和高速模式下，融合多个刚体装甲面的观测。
tracker_batch_min_omega_rad_s: 1.5
tracker_target_switch_min_frames: 3
# 发散确认帧数：EKF 半径超出 [0.05, 0.5] 时，需连续这么多帧才判定目标丢失。
# 1 = 单帧即判丢（原行为）。目标是避免快速移动时的单帧抖动直接导致跟丢；
# 2026-10-14 实测：单帧判定在手持快速移动下产生 64 次发散、22 次短暂丢失。
# 2026-10-15 调整为 4 帧（约 65ms @60fps）作为灵敏度与稳定性的折中。
tracker_diverge_confirm_frames: 4
# 稳健的整车迭代更新。偏航仍由 YawESKF 联合处理。
whole_state_iekf_enabled: true
whole_state_iekf_max_iterations: 4
whole_state_iekf_stop_threshold: 0.0001
whole_state_iekf_huber_threshold: 1.5
# 独立的 SO(2) 偏航 ESKF，用于模型选择和未来装甲面相位估计。
# 11 状态 EKF 仍负责估计车体中心、半径和高度。
yaw_eskf_angular_jerk_variance: 20.0
yaw_eskf_measurement_floor_deg: 1.0
yaw_eskf_nis_reject_threshold: 16.0
yaw_eskf_min_trusted_updates: 4                # 从6降到4：降低冷启动延迟，更快建立trust
yaw_eskf_trusted_rate_std_rad_s: 3.0          # 从2.0升到3.0：方差阈值9.0，容忍装甲板换面时的1.5 rad/s角速度波动
yaw_eskf_max_trusted_abs_rate_rad_s: 8.0       # 拒绝关联导致的异常尖峰；此类尖峰可达 15--40 rad/s
yaw_eskf_max_trusted_abs_acceleration_rad_s2: 30.0
max_temp_lost_count: 15
outpost_max_temp_lost_count: 75

#####-----瞄准器参数-----#####
yaw_offset: 0.0  # 动态视觉跟随以测量中心为零；避免静态偏置被计入预测超前量
pitch_offset: 6.0          # 2026-10-20 现场值（小电脑 standard.yaml 同步）

comming_angle: 60
leaving_angle: 20

decision_speed: 0.8
# 根据现场反馈，明确采用 85 ms 的命令至弹着预测延迟。
# 高速和低速预测均使用同一套实测标定值。
# 2026-10-20 实测（当天 154 次拨弹）：开火命令→拨弹起转 23.5 ms（14.4~37），
# 起转→停转 74.4 ms（39.8~164.2），即命令→出弹 ≈ 98 ms。
# 此处同时决定「瞄准点超前量」与「弹着相位门的推算时域」，必须用实测值：
# 取 0.205 会按多算的 (0.205-0.098)=107 ms 提前量开火，ω≈1.57 rad/s 时
# 相位超前 ≈9.6°，r=0.27 m 上就是 ≈45 mm——正好是 135 mm 板上前缘的位置。
# 步进：10 ms ≈ 0.9° ≈ 4 mm（板上）。若跑到后缘就往上加 0.02~0.03；
# 若仍在前缘就往下减 0.02。若确认实弹初速是 17.3 m/s（配置当前按 19.8 算
# 飞行 0.209 s），飞行时间还差 0.03 s，量等效延迟可取到 0.13。
#
# ⚠️ 2026-10-23 失败尝试（勿重蹈）：曾据电控「一步耗时 0.48 s」把本键从 0.2 改到 0.50，
# 结果弹着严重偏离装甲板。原因是 0.48 s 是「步进动作完成」的耗时，不是「弹丸出膛」
# 的耗时——弹丸在拨弹轮转到中途时就被摩擦轮咬住甩出，出膛明显早于步进到位。
# 因此 0.2 这个量级是对的，不要再按「步进耗时」去推算延时。
# 现场原始值：0.2（单发改造后；早期为 0.085 → 0.1 → 0.195/0.205）。
high_speed_delay_time: 0.176
low_speed_delay_time: 0.171

actuation_delay_ms: 0

yaw_ramp_t0: 0.10
yaw_ramp_t0_pos: 0.10
yaw_ramp_t0_neg: 0.10

#####-----开火控制参数-----#####
first_tolerance: 3
second_tolerance: 2
judge_distance: 2
# 阶段 2D.5 开火空跑：计算并记录开火条件是否满足，但仍阻止向 XUC 发送开火命令。
auto_fire: true

#####-----相机配置（海康 HikRobot）-----#####
camera_name: "hikrobot"

exposure_ms: 6.0
gain: 16.0
camera_width: 1600
camera_height: 1080
camera_offset_x: 736              # (3072 - 1600) / 2
camera_offset_y: 480              # 居中为 484，按 8 对齐取 480
camera_fps: 60.0
white_balance_auto: "off"
hikrobot_pixel_format: "BayerRG8"

# 海康相机 VID:PID（lsusb 确认）
vid_pid: "2bdf:0001"

debug: false
# 现场调参时保留投影画面；正式压力测试可改回 true 以减少显示开销。
competition_headless: true   # 关显示：每帧约 11ms，60fps 必需
# PlotJuggler 每帧序列化 37 字段并 UDP 发送，无监听时纯属浪费。现场关闭。
plotter_streaming_enabled: false

# 相机硬触发（与电控 CAN 命令同步触发曝光）
trigger_enable: false
trigger_source: 2
trigger_activation: 0

#####-----相机标定参数（海康内参/外参，1440×1080）-----#####
# 2026-10-09，使用 23 张图像；平均重投影误差：0.5066 px；均方根误差：0.5962 px。
# 1600x1080 居中感兴趣区域，OffsetX=736、OffsetY=480；传感器完整尺寸：3072x2048。
# 仅进行裁剪平移：cx -= 736、cy -= 480；fx/fy 和畸变参数保持不变。
# 完整画幅主点 (1465.505908, 1053.887837) 减去裁剪区域原点。
camera_matrix: [2613.6238346662558, 0, 831.13793261490321, 0, 2623.9361517252046, 601.15236567678858, 0, 0, 1]
distort_coeffs: [-0.14672657883564594, 0.63738545399917312, -0.00079995678728670956, -0.0020413307914658638, 0]

R_gimbal2imubody: [-1, 0, 0, 0, 1, 0, 0, 0, -1]

# 相机同理想情况的偏角: yaw-13.87 pitch4.87 roll1.39（与 calibration_hikrobot.yaml 一致，2026-08-04 外参验证用）
# 安全候选：保留官方 yaw/pitch，移除实测水平扫动中被证伪的 4.8655° roll 串扰
# 2026-10-10 回填：R 取 011048 / wide / wide4 三轮独立采集的平均（跨批次一致性 ±0.9°）；t 用机械实测值（IMU 在相机后方 20cm、右侧 5cm、低 2cm）
R_camera2gimbal: [0.021136135, -0.009577720, 0.999730729, -0.999776201, -0.001103297, 0.021126526, 0.000900656, -0.999953524, -0.009598896]
t_camera2gimbal: [0.20, 0.05, 0.02]

#####-----CAN 协议配置-----#####
new_can_quat_id: 0x150
new_can_cmd_id: 0x170
can_interface: "can0"
cboard_enable: false             # 新版IMU接到下位机，禁止等待旧CAN姿态
debug_rx: false
debug_tx: false

#####-----轨迹规划器参数-----#####
fire_thresh: 0.0035
max_yaw_acc: 100
Q_yaw: [9e6, 0]
R_yaw: [0.5]
max_pitch_acc: 100
Q_pitch: [9e6, 0]
R_pitch: [1]

#####-----XUC 新版双向串口（实际波特率需接板确认）-----#####
xuc_enable: true                 # 接收IMU，发送云台目标角
xuc_serial_port: "/dev/serial/by-id/usb-1a86_USB_Serial-if00-port0"
xuc_serial_baud: 460800          # 与下位机 USART6 一致
xuc_yaw_sign: 1                 # 命令 yaw 符号；约定：帧内 yaw 增大 = 云台向左转
xuc_pitch_sign: 1                # 命令 pitch 符号；约定：帧内 pitch 增大 = 向下俯
xuc_imu_angle_unit: deg         # 回传 IMU 角度单位（驱动转为弧度）
xuc_command_angle_unit: deg     # 下发命令单位；电控 73ea451 固件期望度（与 GetAngleYaw 同单位）
xuc_imu_yaw_sign: -1            # 与标定保持一致；用户已于 2026-10-10 核实原始偏航值
xuc_imu_pitch_sign: 1            # 下位机IMU pitch方向，实机小角度确认
xuc_imu_yaw_offset_rad: 0.0
xuc_imu_pitch_offset_rad: 0.0
xuc_require_feedback_for_control: true
xuc_require_auto_mode_for_control: false  # 下位机按当前遥控器档位直接回报 mode；避免串口互锁
xuc_max_yaw_excursion_rad: 0.0          # 双轴联调：上位机不额外截断，下位机保留 Yaw ±25°/实际±28°保护
xuc_lock_pitch_for_control: false       # 允许下发 Pitch；下位机限制 ±15°/80°每秒
xuc_allow_control: true             # 弱光环境下的偏航/俯仰跟随测试
xuc_allow_shoot: true               # 2026-10-12 22:35 解除开火限制（试射）；其余发射门控全部保留
# 2026-10-14 新增：常驻 control 开关。开启后，AUTO 档内目标丢失超短时窗口时，
# 保持 control=1（摩擦轮继续转）并锁定当前姿态（云台不动），避免反复停启。
# 退出 AUTO 或链路失效时自动失效，控制权交还遥控器。
# 2026-10-15 现场已启用（与远程一致）。
xuc_control_persist_enabled: true
xuc_fire_guard_enabled: true  # Measured gates plus bounded mature prediction continuation.
# true: inhibit temporary loss; false: mature same-model/same-face continuation only.
xuc_fire_inhibit_temp_lost: false
# Age from last trusted associated IMAGE timestamp, including processing and send delay.
xuc_fire_temp_lost_max_age_ms: 50.0
xuc_fire_stable_ms: 120.0          # 短时防抖；重复触发由反馈驱动的脉冲处理
xuc_fire_yaw_tolerance_deg: 3.0    # 0.91m约±4.8cm，仍在小装甲板水平范围内
xuc_fire_pitch_tolerance_deg: 1.1  # 介于无射击的0.8°与明显低弹的2.0°之间；配合更强Pitch闭环
xuc_gyro_center_follow_enabled: true
xuc_gyro_omega_threshold_rad_s: 0.8
# 根据可信度选择装甲板、车体或相位时钟模型。
xuc_vehicle_model_enter_rad_s: 0.8
xuc_vehicle_model_exit_rad_s: 0.45
xuc_high_speed_enter_rad_s: 3.2
xuc_high_speed_exit_rad_s: 2.5
xuc_rotation_mode_dwell_ms: 600
xuc_rotation_tracker_dropout_hold_ms: 500  # 装甲面短暂交接时保留模型，但禁止开火
xuc_rotation_rate_filter_tau_ms: 100
# 每次装甲面交接时，原始 EKF 角速度会下降约 1.3--1.8 rad/s，而过零 PLL
# 仍稳定在约 4.5 rad/s。不要因这种周期性估计波动丢弃可靠的相位锁定；
# 真正的快慢速切换仍会跨过下方 3.2/2.5 rad/s 的模式迟滞阈值。
xuc_rotation_rate_disagreement_rad_s: 2.2
xuc_rotation_speed_step_reset_rad_s: 2.5
xuc_rotation_rate_agreement_updates: 3
xuc_rotation_rate_disagreement_updates: 18
xuc_gyro_center_hold_ms: 3000.0
xuc_fire_require_tracker_converged: true
xuc_one_face_once_fire: false
xuc_one_face_limit_deg: 15.0
xuc_one_face_rearm_deg: 34.0
xuc_gyro_fire_stable_ms: 20.0
# 【弹着相位门】center_follow 下炮口指向旋转中心，弹丸沿中心线穿过靶心，命中
# 只取决于"弹到瞬间哪块装甲板压在视线上"。相位用实测体相位 x[6] + 窗口平均
# 角速度外推（不碰 YawESKF 的瞬时 ω，它在换面节律上摆 0.5~0.9 rad/s，
# 折到 0.37 s 预测时域是 ±13~19°，会把门指错）。
# 窗口角：允许的弹着相位偏差。10° 对应板半张角 13~15° 留 3~5° 余量。
# 0 = 关闭相位门（回到“节奏一到就开火”）。
#
# 2026-10-20 现场决定：暂时置 0（关闭）。依据（当天 10 场日志、154 发）：
#  · 门开着时频率 0.19~0.5 发/s；门关闭（|ω|<0.30 自动旁路）时 1.04~1.10 发/s；
#  · 相位速率不可信：有一场 ω 报 +1.5 rad/s，而体相位 44 s 内一直停在
#    +55~+62°（换一面被 ±90° 拉回一次，净推进≈0），据此外推的弹着相位
#    落在折叠边界（|e| 中位数 33.8°），门 90% 的时间是关闭的；
#  · 唯一支持它的证据只有 10-19 23:38 那一场（靶心:中轴≈4:1），而那一场同时
#    还带着 650d53d 的整车几何 + 方向性选板，收益无法单独归给相位门。
# 重新启用的前提：把"换面时相位锚点被拉回"这件事修好（让净推进与逐帧转速一致）。
xuc_fire_phase_window_deg: 0.0
# 平均角速度的窗口长度；台架匀速，2.5 s 足够把 ω 抖动平均掉。
xuc_fire_phase_rate_window_ms: 2500.0
# 固定目标仍使用 xuc_fire_yaw_tolerance_deg 和 350 ms 稳定判定。
# 陀螺模式仅将当前帧像素误差作为宽松的可见性保护条件；
# 具体开火时刻由物理相位事件时钟确定。
xuc_gyro_predicted_fire_enabled: true
# 物理相位事件时钟未锁定时，高速旋转不得退回到按瞬时偏航误差开火。
# 这样可避免出现 2026-09-11 23:34 现场日志中第 1 至 20 发那样
# event=0、cycle=-1 的弹次。
# 2026-10-20 定：高速靶是最终目标，本键置 false —— 事件钟 interval_safe 不成立时
# 退回直接门控，否则高速档（ω≈4.5 rad/s）整场 0 发。对照实测：同一转速下带
# 启用回退的两场为 0.85 / 0.56 发/s，未启用时为 0 发。
xuc_gyro_require_event_lock_for_fire: false
# 直接门控的预测偏航容差。center_follow 下瞄准点超前量 ≤ r/d ≈ 3.9°，1.5° 会把
# 大部分帧挡在门外，放 3.0° 让直接门控真正接管。
xuc_gyro_predicted_yaw_tolerance_deg: 3.0
# 真正的命中窗口：弹到瞬间最近装甲板中心与炮口线的夹角上限（度）。
# 板半角约 atan(6.75cm/距离)，3.45 m 处约 1.1°；0 = 关闭，恢复旧行为。
xuc_fire_impact_alignment_deg: 1.0
# 换板抑制：本发预测瞄准点与上一发相比位移超过该值即判为换板（米）。0=关闭。
# 换板瞬间追逐新板是"第一发中、第二发追着同一块板跑空"的来源，宁可不发。
xuc_fire_armor_jump_distance_m: 0.0   # 帧间基准实现有误，暂时关闭
# 判为换板后的禁火时长（毫秒），避开交接瞬间。
xuc_fire_armor_jump_hold_ms: 100.0
xuc_gyro_predicted_yaw_trim_deg: -1.0
xuc_gyro_visibility_yaw_tolerance_deg: 8.0
xuc_gyro_fire_min_consecutive_frames: 3
# No additional selection wait: issue when the current candidate reaches four frames.
xuc_gyro_fire_selection_max_wait_ms: 0.0
xuc_gyro_fire_selection_near_deg: 0.5
# 候选窗口迟滞：门控抖动连续 N 帧（≈N/60 s）仍保留候选窗口，超过才复位。
# 相位窗一次只开 0.2 s 量级，单帧抖动就清零重来会把开火机会按帧数乘性削掉
# （2026-10-20 实测：22 s 内 13 次候选启动 / 13 次复位，只成 2 发）。
# 0 = 旧行为（单帧即复位），便于对照测试。
xuc_fire_candidate_hold_frames: 3
# 下位机在上一次拨弹停止约 0.59 s 后开始下一次拨弹
# （2026-09-12 日志，共匹配 124 发）。此处等待 0.55 s 可避免队列中的命令过期，
# 同时保留下位机实际支持的最高重复频率。
xuc_feeder_active_rpm_threshold: 300.0
# 2026-10-21 现场改为 0：电控已改成「收到 shoot 上升沿就拨一颗」，不再需要等上一个
# 拨弹周期结束。550 会在遥测模式下把每次开火后的等待拉到 0.55 s，实测把频率压到
# 0.18 发/s（2026-10-22 22:04 场，日志 post-feed hold=550 ms）。
xuc_gyro_post_feed_recovery_ms: 0
# 开火节奏回退间隔（毫秒）。0 = 保持原“依赖拨弹遥测”模式；>0 = 不依赖遥测，
# 改为“距上次开火至少间隔 N ms”。
# 启用原因（2026-10-13 实测）：电控固件把 bullet_speed/bullet_count 写死为 0，
# 遥测模式下永远等不到拨弹反馈，开火被反复 inhibit（30 秒仅 7 发）；
# 同一次实测已证明单帧 shoot=1（约 10ms）即可触发拨弹动作，故固定间隔可行。
# 步进模式一次完整拨弹约 480 ms（电控提供），命令到起转约 20~30 ms。
# 最小请求间隔取 550 ms，给完整动作留余量；RPM 降到阈值以下不代表位置到位，
# 不能再用旧的 250 ms 或 feeder_stop 日志作为完整拨弹已结束的依据。
# 这里只限制最小间隔，到期仍须通过当前帧候选与择时门控，不定时补发旧请求。
# 完整拨弹时间只约束重复请求，不替代实弹标定的预测延迟 0.17 s。
xuc_fire_cadence_fallback_ms: 1100
# 每个模型累计成功发送15次请求后完整重建；0关闭。计的是请求，不是实测出膛数。
# 重建期间禁火，待tracking与滤波可信后恢复；保留上次请求时刻并重新检查当前资格。
xuc_model_rebuild_after_requests: 25
# 模型刚建立时虽已 tracking+converged+yaw_trusted，仍带约 6.4° 稳态偏差
# （现场 gen=1 的 7/24 发实测）。信任需连续保持该时长才允许请求；0=关闭。
xuc_model_settle_ms: 3000.0
# 开火脉冲保持时长（毫秒）。0 = 关闭（单帧脉冲，原行为）。
# >0 时，开火上升沿后把 shoot 维持该时长，使下位机 AUTO 档（速度模式）拨弹轮
# 获得确定性转动时间。实测单帧约 10ms 不足，一颗弹常需 3~4 次脉冲才能推入入口。
# 拨弹完成约需 40~180ms，建议从 120~150ms 起步，按实际出弹情况微调。
# 2026-10-15 现场调参中（130ms）。
# 2026-10-20 现场对比测试（目标：一次拨弹打出一颗弹）：
#  40 ms → 运转 80 ms、推进角中位 315°、离散 4.9~6.9×（一颗弹常需 2~3 次触发）
#  ~80 ms → 运转 160~175 ms、推进角中位 404~526°、离散 3.1~4.0×（明显收窄）
# 现测 120 ms；130 ms 历史上出现过供料卡顿，再往上加要盯双发/卡弹。
# 2026-10-21 定：电控把 AUTO 档改为「收到 shoot 上升沿就拨一颗，保持 1 不重复拨弹」，
# 保持时长从此不影响供弹；120 ms 内持续 shoot=1 只会让边沿判定更脆弱，故置 0。
xuc_shoot_hold_ms: 0.0
# 角速度约为 5 rad/s、帧率为 60 FPS 时，同一装甲板每帧前进约 5°；
# 四块装甲板之间的身份切换约为 90°。相位发生较大跳变时，重新开始两帧判定窗口。
xuc_gyro_candidate_max_phase_step_deg: 20.0
xuc_direct_yaw_guard: true              # 当前以稳定测量为主；保留预测接口供 EKF 调稳后启用
xuc_direct_yaw_boresight_correction_deg: -2.65  # 2026-10-20 重标内参后现场重拉（旧值 -0.5 是按旧 K 调的）
xuc_direct_yaw_impact_correction_deg: 0.0  # 已重置：旧值是按旧外参调出来的
xuc_yaw_tracking_pi_enabled: false      # 已禁用：现场抖动来自模型/超前量切换；保留单一动态控制器
xuc_yaw_tracking_kp: 0.0                # 禁用快速外层比例环；位置比例控制已由下位机负责
xuc_yaw_tracking_ki_per_s: 0.18         # 缓慢学习静态偏差；按观测到的残差约为 0.2 度/秒
xuc_yaw_tracking_integral_limit_deg: 0.8
xuc_yaw_tracking_output_limit_deg: 0.8  # 不得激发内环，也不得取代 ESKF/相位超前量
xuc_yaw_tracking_integrate_error_limit_deg: 1.5  # 排除装甲面交接和预测跳变
xuc_yaw_tracking_arm_dwell_ms: 600.0    # 仅在 mode=1 且 yaw_armed=1 稳定后从零开始
xuc_max_prediction_lead_rad: 0.10472     # 移动靶最多超前6°；保留测量守卫，禁止EKF发散越界
# 车体中心跟随（center_follow）只跟旋转中心，用于消除换面跳变。
# 注意：车体绕自身中心自转 ⇒ 中心不平移 ⇒ **不需要补偿 omega*flight_time 提前量**
# （装甲板相对中心只偏 atan(r/d)≈2.3°，而 omega*flight_time 约 21°，大一个数量级，
#  直接加会把云台推出装甲板）。真正会滞后的是"中心估计"本身：它是短窗拟合值。
# 开启后按中心自身横向速度前推飞行时间再取方位差，包络远小于 atan(r/d)。
# 2026-10-18 加入，默认 false —— 需现场跑一轮确认有效再启用。
xuc_center_follow_lead_enabled: false
# 中心横向速度低于此值视为"原地自转"，不欠提前量，避免给静止靶注入噪声。
xuc_center_follow_lead_min_center_speed_mps: 0.30
# 修正包络（度）。必须远小于 atan(r/d)≈3.3°（r=0.26,d=4.5），否则会把云台推离装甲板。
# C++ 侧硬钳 5°。
xuc_center_follow_lead_max_deg: 3.0
xuc_direct_yaw_filter_tau_ms: 60.0       # 抑制装甲面/模型交接时的指令振荡
xuc_direct_yaw_hold_ms: 300.0            # 移动靶短丢帧继续使用6°内有界预测；更长丢失停控
xuc_direct_yaw_max_rate_dps: 90.0        # 限制指令变化速率，防止云台突然反转
xuc_final_yaw_command_max_rate_dps: 30.0 # 抑制完整 ESKF 超前量及装甲板/车体模型交接带来的变化
xuc_direct_pitch_guard: true             # 使用装甲板像素纵向误差 + 当前IMU生成绝对 Pitch 目标
xuc_direct_pitch_filter_tau_ms: 100.0    # 仅使用关联成功且坐标一致的观测，抑制单帧纵向抖动
xuc_direct_pitch_hold_ms: 180.0          # 已保存双轴验收值：短丢帧保持
xuc_direct_pitch_max_rate_dps: 10.0      # 约60FPS下每帧最多变化0.167°；首次控制/长丢失恢复从反馈角起步
xuc_direct_pitch_error_gain: 1.35        # 恢复稳态控制能力；低于此前验证过的 1.65 增益
xuc_projectile_speed_mps: 19.8        # 2026-10-20 现场值（小电脑同步）；2026-10-16 实测（测速文件）：摩擦轮降速后弹速 17.3 m/s；2026-10-18复测：19m/s为0/20，17.3m/s为5/20；因果待更多样本确认
xuc_ballistic_reference_projectile_speed_mps: 10.0  # 0.91m/17cm实弹基准采集于2500rpm，禁止随当前转速重算
xuc_ballistic_pitch_enabled: true
xuc_camera_forward_of_muzzle_m: 0.06     # 实测：相机中心在炮口前方 6 cm
xuc_camera_above_muzzle_m: 0.04          # 实测：相机中心在炮口上方 4 cm
xuc_ballistic_reference_camera_range_m: 0.91
xuc_ballistic_reference_total_drop_m: 0.08639  # 实测 10 m/s 基准；固定瞄准轴偏差设为零
xuc_ballistic_max_compensation_deg: 20.0    # 低弹速远距离补偿上限；下位机另保留25°/28°双层保护
xuc_ballistic_pitch_trim_deg: -0.8    # 同侧高弹：在 4.6 m 处将弹着点降低约 2.5 cm
# 弹道仰角和陀螺飞行时间共用稳健的距离估计。
# 以刚体近侧装甲面距离为准；原始 PnP 深度最多只提供有界的 5% 修正，
# 避免倾斜装甲板导致瞄准点偏移数米。
xuc_range_filter_tau_ms: 80
xuc_range_filter_max_rate_mps: 6.0
xuc_range_filter_raw_blend: 0.05
xuc_range_filter_max_raw_residual_m: 0.40
# 现在仅在下位机实际就绪时间附近发送命令。使用由此获得的短且可重复的发射过程，
# 不再针对禁用恢复机制时观察到的 20--746 ms 排队延迟进行预测。
xuc_event_fire_delay_s: 0.085
xuc_event_fire_delay_min_ms: 65
xuc_event_fire_delay_max_ms: 105
# 在串口接收线程中观察拨弹器阈值，以五发匹配数据学习本轮基准，
# 之后仅补偿机械漂移。预热期间保持 85 ms 标定值不变。
# 使用中位数/MAD 窗口、每发 1.5 ms 的变化限制和 65--105 ms 硬边界来避免振荡。
xuc_shot_delay_adaptation_enabled: false
# 注意：自适应采到的是「命令→feeder_stop」，而步进模式下转速阈值会提前触发
# （位置环接近目标时降速），实测只有 ~220 ms，与真实到位 502 ms 差 280 ms。
# 这里把参考值对齐到实测的 220 ms，让自适应只做「漂移修正」、
# 不去改写上面按电控数据标定的 0.50 s 总量。
xuc_shot_delay_reference_ms: 220
# 2026-10-20：自适应样本从「命令→拨弹起转」改为「命令→拨弹停转（≈出弹）」。
# 当天 154 发实测：起转段 14~37 ms 很稳，拨弹运转段 40~160 ms、转速 300~1259 rpm
# （差 4 倍），出弹时刻的抖动几乎全在这一段，所以样本改成整段、上下界随之放宽。
# 基准 = high_speed_delay_time（0.10 s），偏移直接进 aimer 的提前量。
xuc_shot_delay_sample_min_ms: 20
xuc_shot_delay_sample_max_ms: 300
xuc_shot_delay_min_ms: 50
# 上界必须包住 high_speed_delay_time（0.2），否则 normalize_config 会把 nominal
# 夹到上界，传导给 aimer 的延时被悄悄改小。留余量给自适应漂移。
xuc_shot_delay_max_ms: 400
xuc_shot_delay_window: 9
xuc_shot_delay_min_samples: 5
xuc_shot_delay_ewma_alpha: 0.35
xuc_shot_delay_adaptation_gain: 1.0
# 每次最多挪的步长。2026-10-20：hold 从 40 改到 120 会把出弹时刻整体推迟
# ~100 ms，1.5 ms/发 要 70 发才收敛，前十几发的提前量是错的；改 8 ms/发，
# 10~15 发内跟上（中位窗 9 + EWMA 0.35 已经把单发 ±40 ms 的抖动滤掉了）。
xuc_shot_delay_max_step_ms: 8.0
xuc_shot_delay_outlier_sigma: 3.5
xuc_shot_delay_outlier_floor_ms: 4
xuc_shot_delay_95pi_min_half_ms: 8
xuc_event_flight_time_uncertainty_ms: 5
# 满足条件的帧最多可等待此时长，以到达精确的稳态时钟发送时刻。
# 帧率约为 70 FPS 时，提前 30 ms 只包含约两帧决策机会。将提前窗口设为 50 ms，
# 可增加合格事件的机会；随后仍由 sleep_until 在相同的相位截止时刻发送。
xuc_event_trigger_window_ms: 50
xuc_event_send_late_tolerance_ms: 2
xuc_event_crossing_capture_deg: 20
xuc_event_crossing_rearm_deg: 12
xuc_event_min_crossing_separation_ratio: 0.55
xuc_event_period_min_ms: 120
xuc_event_period_max_ms: 1200
# 连续折叠车体相位 PLL。保持为 154 ms 现场延迟标定时使用的相位响应；
# 命中宽度判定使用稳健的残差离散度，而不是已标定的平均偏移。
xuc_event_period_ema_alpha: 0.20
xuc_event_max_period_relative_error: 0.22
xuc_event_max_period_step_ratio: 0.025
xuc_event_omega_period_weight: 0.15
xuc_event_period_residual_alpha: 0.08
xuc_event_phase_correction_alpha: 0.15
xuc_event_max_phase_correction_ms: 3
xuc_event_max_phase_residual_ms: 90
xuc_event_period_window_size: 7
xuc_event_phase_residual_window_size: 5
xuc_event_phase_uncertainty_floor_ms: 2
xuc_event_min_lock_updates: 3
xuc_event_relock_rejections: 3
xuc_event_armor_width_m: 0.135
xuc_event_armor_edge_margin_m: 0.0
xuc_event_model_phase_uncertainty_deg: 0.7
# 仅放宽保守的相位预算。锁定状态、装甲面身份和云台跟踪仍为必需条件，
# 因此不会重新允许 event=0/cycle=-1 的弹次。
# 现场日志显示跟踪和 PLL 状态正常，但保守的相位总预算会拒绝大多数原本可用的装甲面。
# 保持锁定状态和装甲面身份为必需条件，同时适当放宽物理开火窗口。
xuc_event_phase_grace_deg: 4.0
# 直接观测到的相位时钟进入安全时间区间后即可开火。
# 未来装甲面一致性仍用于诊断，但不再否决其他条件均有效的事件：现场日志显示，
# 装甲面交接歧义是错失机会的主要原因。事件锁定、新鲜视觉数据、俯仰、云台跟踪、
# 每周期只开火一次以及拨弹器恢复等门控条件仍然必须满足。
xuc_event_require_face_consistency: false
# 为每个事件周期锁定未来实际装甲面，之后再交接到下一块装甲面。
# 开火还要求云台正在跟随其指令。
xuc_event_face_max_alignment_deg: 15.0
xuc_event_gimbal_tracking_tolerance_deg: 4.0
xuc_shot_feedback_timeout_ms: 800
